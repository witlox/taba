name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

# Tier 2 — slow-marked unit tests (`#[ignore = "slow:…"]`) + full BDD
# suite (all 265 scenarios, no @smoke filter). Runs nightly and on
# manual dispatch.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2

  test-slow:
    name: Unit Tests (Tier 2 slow)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --exclude taba-acceptance --locked
      # Run all ignored tests EXCEPT requires-docker (those run in
      # the docker-e2e job). Since all ignored tests in the workspace
      # are in taba-node and marked requires-docker, just exclude
      # taba-node from this invocation.
      - run: cargo nextest run --workspace --exclude taba-acceptance --exclude taba-node --run-ignored=only --no-tests=warn --locked
      - run: cargo test --workspace --doc --locked

  bdd-full:
    name: BDD Full (Tier 2)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p taba-acceptance --test acceptance

  integration-full:
    name: Integration Tests (Tier 3)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p taba-integration

  docker-e2e:
    name: Docker E2E (Tier 3)
    runs-on: ubuntu-latest
    needs: [fmt, clippy]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # ubuntu-latest has Docker pre-installed. The bollard-based
      # DockerRuntime tests connect to /var/run/docker.sock.
      - run: docker info
      - run: cargo nextest run -p taba-node --run-ignored=only --locked
