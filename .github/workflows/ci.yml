name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "*.md"
      - "LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "*.md"
      - "LICENSE"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

# Three-tier CI (matching the project's justfile):
#
#   Stage 1 (parallel, no deps): fmt, clippy, deny.
#   Stage 2 (depends on Stage 1): unit-tests-fast, bdd-smoke.
#
# Tier 1 = fast unit tests + BDD @smoke scenarios. Slow-marked tests
# (`#[ignore = "slow:…"]`) and the full BDD suite live in the
# `nightly.yml` workflow (Tier 2). E2e tests (Tier 3) require Docker
# and are in the `release.yml` workflow.

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — fast checks, gate everything (run in parallel)
  # ---------------------------------------------------------------------------

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ---------------------------------------------------------------------------
  # Stage 2 — Tier 1 fast tests (depend on Stage 1)
  # ---------------------------------------------------------------------------

  unit-tests-fast:
    name: Unit Tests (Tier 1 fast)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, deny]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo test --workspace --doc --locked

  bdd-smoke:
    name: BDD @smoke (Tier 1 fast)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, deny]
    env:
      TABA_BDD_FAST: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p taba-acceptance --test acceptance
