name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "*.md"
      - "LICENSE"
      - "book.toml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "*.md"
      - "LICENSE"
      - "book.toml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

# Three-tier CI:
#   Stage 1 (parallel, no deps): fmt, clippy, deny.
#   Stage 2 (depends on Stage 1): unit-tests-fast, bdd-smoke.
#
# Tier 1 = fast unit tests + BDD @smoke scenarios. Slow-marked tests
# (`#[ignore = "slow:…"]`) and the full BDD suite live in
# `nightly.yml` (Tier 2). Integration tests (Tier 3) are in
# `nightly.yml` as well.

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — fast checks, gate everything (run in parallel)
  # ---------------------------------------------------------------------------

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ---------------------------------------------------------------------------
  # Stage 2 — Tier 1 fast tests (depend on Stage 1)
  # ---------------------------------------------------------------------------

  unit-tests-fast:
    name: Unit Tests (Tier 1 fast)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, deny]
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --exclude taba-acceptance --locked
      - run: cargo test --workspace --doc --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [fmt, clippy, deny]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --no-report --workspace --locked
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  bdd-smoke:
    name: BDD @smoke (Tier 1 fast)
    runs-on: ubuntu-latest
    needs: [fmt, clippy, deny]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run BDD @smoke
        env:
          TABA_BDD_FAST: "1"
        run: cargo test --locked -p taba-acceptance --test acceptance

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [fmt, clippy, deny]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p taba-integration
