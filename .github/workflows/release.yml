name: Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  # ---------------------------------------------------------------------------
  # Preflight — full test suite + lint + deny (must pass before release)
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight (Tier 3)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      - name: Compute and set version
        id: version
        run: |
          bash scripts/set-version.sh
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --exclude taba-acceptance --locked
      - run: cargo nextest run --workspace --exclude taba-acceptance --run-ignored=only -E 'not(ignore("requires-docker"))' --no-tests=warn --locked
      - run: cargo test --workspace --doc --locked

      - name: BDD @smoke
        env:
          TABA_BDD_FAST: "1"
        run: cargo test --locked -p taba-acceptance --test acceptance

      - name: Integration tests
        run: cargo test --locked -p taba-integration

      - uses: EmbarkStudios/cargo-deny-action@v2

  # ---------------------------------------------------------------------------
  # Coverage — codecov upload
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --no-report --workspace --locked
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Binary builds — taba CLI + taba-k8s (x86_64 + aarch64)
  # ---------------------------------------------------------------------------
  binaries:
    name: Binaries (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: aarch64
          - target: x86_64-apple-darwin
            runner: macos-latest
            arch: x86_64-macos
          - target: aarch64-apple-darwin
            runner: macos-latest
            arch: aarch64-macos
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binaries
        run: cargo build --release --target ${{ matrix.target }} --bin taba --bin taba-k8s

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/taba dist/
          cp target/${{ matrix.target }}/release/taba-k8s dist/
          cd dist
          tar czf "../taba-${{ matrix.arch }}.tar.gz" *
          cd ..
          sha256sum "taba-${{ matrix.arch }}.tar.gz" > "taba-${{ matrix.arch }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: taba-${{ matrix.arch }}
          path: |
            taba-${{ matrix.arch }}.tar.gz
            taba-${{ matrix.arch }}.tar.gz.sha256

  # ---------------------------------------------------------------------------
  # Docker image — ghcr.io
  # ---------------------------------------------------------------------------
  docker:
    name: Docker image
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.preflight.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Publish — GitHub release with all artifacts
  # ---------------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [preflight, coverage, binaries, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: taba-*
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.preflight.outputs.version }}
          name: taba v${{ needs.preflight.outputs.version }}
          generate_release_notes: true
          body: |
            ## Binaries

            | Archive | Platform | Contents |
            |---------|----------|----------|
            | `taba-x86_64.tar.gz` | Linux x86_64 | taba, taba-k8s |
            | `taba-aarch64.tar.gz` | Linux aarch64 | taba, taba-k8s |
            | `taba-x86_64-macos.tar.gz` | macOS x86_64 | taba, taba-k8s |
            | `taba-aarch64-macos.tar.gz` | macOS aarch64 | taba, taba-k8s |

            ## Docker

            ```
            docker pull ghcr.io/${{ github.repository }}:${{ needs.preflight.outputs.version }}
            ```
          files: |
            taba-*/taba-*.tar.gz
            taba-*/taba-*.tar.gz.sha256
