name: Install protoc
description: Install protobuf compiler for prost builds
runs:
  using: composite
  steps:
    - name: Install protoc
      shell: bash
      run: |
        set -euo pipefail
        if command -v protoc >/dev/null 2>&1; then
          echo "protoc already installed: $(protoc --version)"
          exit 0
        fi
        PB_REL="https://github.com/protocolbuffers/protobuf/releases"
        PB_VER="29.3"
        arch=$(uname -m)
        case "$arch" in
          x86_64)  pb_arch="x86_64";;
          aarch64) pb_arch="aarch_64";;
          *) echo "Unsupported arch: $arch"; exit 1;;
        esac
        curl -sL "$PB_REL/download/v$PB_VER/protoc-$PB_VER-linux-$pb_arch.zip" -o /tmp/protoc.zip
        sudo unzip -q /tmp/protoc.zip -d /usr/local
        rm /tmp/protoc.zip
        protoc --version
