# cargo-deny configuration for the taba workspace.
# Enforced in CI; see .github/workflows/ci.yml and justfile.

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "OpenSSL",
    "BlueOak-1.0.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses.private]
ignore = true

[[advisories.ignore]]
id = "RUSTSEC-2025-0111"
reason = "tokio-tar is a transitive dev-dependency via testcontainers -> bollard. Not on any taba data path."
