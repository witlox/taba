# cargo-deny configuration for the taba workspace.
# Enforced in CI; see .github/workflows/ci.yml and justfile.

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "OpenSSL",
    "BlueOak-1.0.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses.private]
ignore = true

[[advisories.ignore]]
id = "RUSTSEC-2025-0111"
reason = "tokio-tar is a transitive dev-dependency via testcontainers -> bollard. Not on any taba data path."

# wasmtime advisories: taba does not execute untrusted WASM.
# Workloads are authored by trusted authors with Ed25519 signing (INV-S3).
# The wasmtime runtime is used for trusted workload execution, not
# for sandboxing untrusted code.
[[advisories.ignore]]
id = "RUSTSEC-2026-0093"
reason = "wasmtime component model UTF-16 transcoding — not used by taba (no component model)"

[[advisories.ignore]]
id = "RUSTSEC-2026-0094"
reason = "wasmtime Winch compiler backend — taba uses cranelift, not Winch"

[[advisories.ignore]]
id = "RUSTSEC-2026-0095"
reason = "wasmtime Winch sandbox escape — taba uses cranelift, not Winch"

[[advisories.ignore]]
id = "RUSTSEC-2026-0096"
reason = "wasmtime Cranelift aarch64 heap access — taba workloads are trusted (INV-S3)"

[[advisories.ignore]]
id = "RUSTSEC-2026-0222"
reason = "wasmtime type index confusion between engines — taba uses a single engine"

[[advisories.ignore]]
id = "RUSTSEC-2026-0269"
reason = "wasmtime filesystem sandbox escape via trailing slashes — taba workloads are trusted"

[[advisories.ignore]]
id = "RUSTSEC-2026-0316"
reason = "wasmtime dynamic record lifting fuel — taba does not use component model hostcalls"

